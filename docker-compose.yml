services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: portfolio

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Монтируем сертификаты из системы в контейнер
      - /etc/letsencrypt/live/ваш-домен.ru/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/ваш-домен.ru/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro